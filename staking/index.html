<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%alephium-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stake ALPH on PowFi, preview your xALPH deposit and track transaction confirmation with your Alephium wallet." />
    <title>PowFi — Stake ALPH</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('powfi-theme')
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/stakingPage.ts"></script>
  </body>
</html>
