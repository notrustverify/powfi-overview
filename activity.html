<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="alephium-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recent xALPH stake, unstake, and reward activity for the PowFi campaign on Alephium, read live from the on-chain event log." />
    <title>PowFi — Staking Activity</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('powfi-theme')
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/activity.ts"></script>
  </body>
</html>
